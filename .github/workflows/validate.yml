name: React build and destination configuration validation
# Manual-only. No Azure credentials, uploads, publication or run on push.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install locked frontend dependencies
        run: npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
      - name: Run actual source scripts and public runtime checks
        run: npm test --prefix frontend
      - name: Build the React production bundle
        run: npm run build --prefix frontend
      - name: Check original runtime writer and public destination staging
        run: |
          python -B -m unittest discover -s reference -v
          python -B -m unittest discover -s tests -v
      - name: Stage two destinations without publishing
        run: |
          python -B scripts/prepare_site.py --config config/nonproduction.example.json --output .release/nonproduction
          python -B scripts/prepare_site.py --config config/production.example.json --output .release/production
